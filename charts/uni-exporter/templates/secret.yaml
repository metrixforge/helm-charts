{{- if .Values.credentials.create -}}
{{- if not .Values.credentials.appId }}{{ fail "credentials.appId is required (or set credentials.create=false + credentials.existingSecret). Get it from the MetrixForge dashboard → cluster connect." }}{{- end }}
{{- if not .Values.credentials.appSecret }}{{ fail "credentials.appSecret is required (or set credentials.create=false + credentials.existingSecret). It is shown once in the MetrixForge dashboard." }}{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "uni-exporter.secretName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "uni-exporter.labels" . | nindent 4 }}
type: Opaque
stringData:
  APP_ID: {{ .Values.credentials.appId | quote }}
  APP_SECRET: {{ .Values.credentials.appSecret | quote }}
{{- end }}
