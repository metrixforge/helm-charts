{{- if .Values.actuator.enabled -}}
# Turns on the actuator polling loop (agent reads ACTUATOR_ENABLED at startup).
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "uni-exporter.fullname" . }}-actuator-config
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "uni-exporter.labels" . | nindent 4 }}
    metrixforge.io/component: actuator
data:
  ACTUATOR_ENABLED: "true"
  DATA_API_URL: {{ .Values.actuator.dataApiUrl | quote }}
  ACTUATOR_POLL_INTERVAL: {{ .Values.actuator.pollInterval | quote }}
  ACTUATOR_HOURLY_LIMIT: {{ .Values.actuator.hourlyLimit | quote }}
  ACTUATOR_LONG_POLL_WAIT: {{ .Values.actuator.longPollWait | quote }}
  {{- if .Values.gitops.writeback.enabled }}
  # Karpenter Phase 7. Older agent images ignore these keys entirely, so a chart
  # ahead of the image is harmless — the feature just stays dormant.
  ACTUATOR_GITOPS_WRITEBACK: "true"
  ACTUATOR_GITOPS_TOKEN_SECRET: {{ .Values.gitops.writeback.tokenSecretRef | quote }}
  ACTUATOR_GITOPS_LLM: {{ .Values.gitops.writeback.llm | quote }}
  {{- end }}
{{- end }}
