{{- if and .Values.actuator.enabled .Values.gitops.writeback.enabled .Values.rbac.create -}}
# Karpenter Phase 7 — GitOps PR-writeback RBAC.
#
# On a Flux/Argo cluster the live object is a projection of a git repo, so a
# direct CRD patch is reverted by the next reconcile. Instead the agent resolves
# the source repo and opens a Pull/Merge Request.
#
# Everything here is READ-ONLY. The grant is the entire standing cost of the
# feature: repo discovery happens just-in-time at PR-creation and reads these
# CRs in memory only. There is deliberately no `uni_nodepool_source` metric and
# no continuous emission — a permission produces no data, no ClickHouse
# cardinality and no extra per-scrape payload.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "uni-exporter.fullname" . }}-gitops-writeback
  labels:
    {{- include "uni-exporter.labels" . | nindent 4 }}
    metrixforge.io/component: gitops-writeback
  annotations:
    metrixforge.io/description: >
      Read-only access to Flux/Argo source CRs so the agent can resolve which
      git repository and path render a given object. Used only at the moment a
      PR is created. Delete this ClusterRoleBinding (or set
      gitops.writeback.enabled=false) to revoke.
rules:
  # Flux: Kustomization -> sourceRef -> GitRepository gives (repo, revision, dir).
  - apiGroups: ["kustomize.toolkit.fluxcd.io"]
    resources: ["kustomizations"]
    verbs: ["get", "list"]
  # GitRepository is the git source. ocirepositories/buckets are included NOT
  # because we can use them, but so the agent can DETECT them and refuse with a
  # clear "non_git_source" instead of eating an opaque 403.
  - apiGroups: ["source.toolkit.fluxcd.io"]
    resources: ["gitrepositories", "ocirepositories", "buckets"]
    verbs: ["get", "list"]
  # A NodePool rendered by a HelmRelease needs a second hop: the HelmRelease's
  # own Flux labels point at the Kustomization that carries its values file.
  - apiGroups: ["helm.toolkit.fluxcd.io"]
    resources: ["helmreleases"]
    verbs: ["get", "list"]
  # Argo: Application.spec.source.{repoURL,path,targetRevision}.
  #
  # `list` is unavoidable. With apps-in-any-namespace the Application's
  # namespace isn't derivable from the object's own labels, so we cannot do a
  # targeted get. ⚠️ This exposes the customer's full application inventory,
  # including every repoURL — documented in the enablement docs, because it is
  # a real cost of turning this on.
  - apiGroups: ["argoproj.io"]
    resources: ["applications"]
    verbs: ["get", "list"]
  # ApplicationSet: read only to NAME it in a refusal message. An Application
  # generated by an AppSet must not be PR'd directly — the fix belongs in the
  # AppSet template. Detection itself is free (ownerReference on the App).
  - apiGroups: ["argoproj.io"]
    resources: ["applicationsets"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "uni-exporter.fullname" . }}-gitops-writeback
  labels:
    {{- include "uni-exporter.labels" . | nindent 4 }}
    metrixforge.io/component: gitops-writeback
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "uni-exporter.fullname" . }}-gitops-writeback
subjects:
  - kind: ServiceAccount
    name: {{ include "uni-exporter.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- if .Values.gitops.writeback.tokenSecretRef }}
---
# Git token — a NAMESPACED Role, scoped to exactly one Secret by name.
#
# 🔴 `get` only, never `list`/`watch`: those two IGNORE resourceNames, so adding
# either would silently widen this to every Secret in the namespace. That
# matters concretely — GitRepository.spec.secretRef names the customer's OWN
# Flux git credentials, and handing those to our agent is precisely the wrong
# move for the security-conscious self-hosted-GitLab profile this feature is
# built for.
#
# Read fresh on each PR so rotating the token needs no pod restart. The token
# never leaves the cluster and never reaches MetrixForge's database.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "uni-exporter.fullname" . }}-gitops-token
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "uni-exporter.labels" . | nindent 4 }}
    metrixforge.io/component: gitops-writeback
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: [{{ .Values.gitops.writeback.tokenSecretRef | quote }}]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "uni-exporter.fullname" . }}-gitops-token
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "uni-exporter.labels" . | nindent 4 }}
    metrixforge.io/component: gitops-writeback
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "uni-exporter.fullname" . }}-gitops-token
subjects:
  - kind: ServiceAccount
    name: {{ include "uni-exporter.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
{{- end }}
