apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "uni-security.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "uni-security.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  # Recreate, not RollingUpdate: this agent has no leader election, so two pods
  # overlapping during a rollout would both scan and both upload.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "uni-security.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "uni-security.selectorLabels" . | nindent 8 }}
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      serviceAccountName: {{ include "uni-security.serviceAccountName" . }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: security-agent
          image: "{{ .Values.image.registry }}/{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - --scan-interval={{ .Values.scan.interval }}
            - --scan-timeout={{ .Values.scan.timeout }}
            - --http-listen=:8080
            - --db-path=/data/trivy-db
            - --exclude-namespaces={{ .Values.scan.excludeNamespaces }}
            - --read-existing-reports={{ .Values.existingReports.enabled }}
            - --existing-reports-max-age={{ .Values.existingReports.maxAge }}
            {{- if .Values.compliance.enabled }}
            - --compliance-frameworks={{ .Values.compliance.frameworks }}
            - --compliance-interval={{ .Values.compliance.interval }}
            {{- else }}
            - --compliance-frameworks=
            {{- end }}
          envFrom:
            - configMapRef:
                name: {{ include "uni-security.fullname" . }}-config
            - secretRef:
                name: {{ include "uni-security.secretName" . }}
            {{- if .Values.registryCredentials.existingSecret }}
            - secretRef:
                name: {{ .Values.registryCredentials.existingSecret }}
            {{- end }}
          {{- if and (not .Values.registryCredentials.existingSecret) .Values.registryCredentials.username }}
          env:
            - name: TRIVY_USERNAME
              valueFrom:
                secretKeyRef:
                  name: {{ include "uni-security.fullname" . }}-registry
                  key: TRIVY_USERNAME
            - name: TRIVY_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "uni-security.fullname" . }}-registry
                  key: TRIVY_PASSWORD
          {{- end }}
          ports:
            - name: http
              containerPort: 8080
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 30
            periodSeconds: 60
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 10
            periodSeconds: 30
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          emptyDir:
            sizeLimit: {{ .Values.storage.sizeLimit }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
