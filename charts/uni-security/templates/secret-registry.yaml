{{- if and (not .Values.registryCredentials.existingSecret) .Values.registryCredentials.username -}}
{{- if not .Values.registryCredentials.password }}{{ fail "registryCredentials.password is required when registryCredentials.username is set (or use registryCredentials.existingSecret)" }}{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "uni-security.fullname" . }}-registry
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "uni-security.labels" . | nindent 4 }}
type: Opaque
stringData:
  TRIVY_USERNAME: {{ .Values.registryCredentials.username | quote }}
  TRIVY_PASSWORD: {{ .Values.registryCredentials.password | quote }}
{{- end }}
