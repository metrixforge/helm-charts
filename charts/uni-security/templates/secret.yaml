{{- if .Values.credentials.create -}}
{{- if not .Values.credentials.appId }}{{ fail "credentials.appId is required. Either paste it (--set-string credentials.appId=...) or, if uni-exporter is already installed here, reuse its Secret: --set credentials.create=false --set credentials.existingSecret=uni-exporter-secrets" }}{{- end }}
{{- if not .Values.credentials.appSecret }}{{ fail "credentials.appSecret is required. It is shown once in the MetrixForge dashboard; or reuse uni-exporter's Secret with credentials.create=false + credentials.existingSecret." }}{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "uni-security.secretName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "uni-security.labels" . | nindent 4 }}
type: Opaque
stringData:
  APP_ID: {{ .Values.credentials.appId | quote }}
  APP_SECRET: {{ .Values.credentials.appSecret | quote }}
{{- end }}
